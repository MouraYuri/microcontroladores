; Portaria Eletrônica com ESP32
; Documentação: README.md e Guia Técnico do Projeto

[platformio]
default_envs = esp32dev

; Firmware para a placa ESP32 (compilar, gravar e testes na placa)
[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ; ArduinoJson 6.x: é a major usada pelo UniversalTelegramBot
    bblanchon/ArduinoJson@^6.21.5
    witnessmenow/UniversalTelegramBot@^1.3.0

; Testes unitários no computador, sem placa: pio test -e native
; (exige um compilador C++ instalado: g++/clang no Linux/macOS, MinGW no Windows)
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
